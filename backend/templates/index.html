<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Plant Disease Detection</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <h2>🌿 Potato Leaf Disease Detection</h2>

      <form
        id="upload-form"
        action="/predict"
        method="post"
        enctype="multipart/form-data"
      >
        <input
          type="file"
          name="file"
          id="fileInput"
          accept="image/*"
          required
        />

        <button type="button" id="predictBtn">Predict Disease</button>
      </form>

      <div class="preview">
        <img id="imgPreview" />
      </div>

      <div id="result" class="result"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
